name: epilote
description: "E-PILOTE CONGO v3.0 — Plateforme de gestion scolaire multi-tenant"
publish_to: 'none'
# 3.2.0+19 (2026-08-14) — le « +19 » est ce que le parc COMPARE : la chaîne de
# version ne sert qu'à l'affichage, `build_number` seul décide qu'un poste est
# en retard (mig 0087). Il ne doit donc jamais reculer ni stagner entre deux
# binaires différents — 3.1.7+18 a été livré deux fois, le 06/08 et le 14/08,
# ce qui les rendait indistinguables pour le mécanisme de mise à jour.
version: 3.2.0+19

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === SUPABASE (Auth + DB + Storage) ===
  supabase_flutter: ^2.8.4
  postgrest: ^2.7.0   # requis pour CountOption
  realtime_client: ^2.4.0   # requis pour PostgresChangeEvent

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # === NAVIGATION ===
  go_router: ^14.8.1

  # === UI / DESIGN ===
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  # Backend SQLite pour flutter_cache_manager (cache de cached_network_image)
  # sur desktop Linux/Windows — sans lui, les avatars/logos échouent en dev.
  sqflite_common_ffi: ^2.3.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2
  calendar_date_picker2: ^3.0.0
  flutter_animated_button: ^2.0.4

  # === MÉDIA RICHE (feed social + chat + stories) ===
  video_player: ^2.9.2        # lecture vidéo (feed, chat, stories)
  chewie: ^1.8.5              # contrôles vidéo Material (play/seek/plein écran)
  story_view: ^0.16.6        # viewer Stories type WhatsApp/Instagram
  syncfusion_flutter_pdfviewer: ^33.2.8  # visualisation PDF in-app (sans quitter)
  image: ^4.3.0              # compression/redimensionnement image (pur Dart, universel)
  video_compress: ^3.1.4     # transcodage vidéo (Android/iOS) façon WhatsApp
  record: ^7.1.0             # enregistrement note vocale (appui maintenu façon WhatsApp)

  # === UTILS ===
  # shared_preferences: ^2.3.5  ← à ajouter quand réseau OK
  uuid: ^4.5.1
  logger: ^2.5.0
  connectivity_plus: ^6.1.4
  # Version réellement embarquée dans le binaire installé. Un numéro écrit
  # en dur dans le code se désynchronise — il affichait « 3.0.2 » pour un
  # paquet en 3.1.7. Sur un parc mis à jour à la main, c'est la première
  # question du support : quelle version tourne sur ce poste ?
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  powersync: ^1.18.0
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^33.2.8
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  # `AccumulatorSink` — le calcul d'empreinte EN FLUX. Sans lui, vérifier un
  # installateur de 34 Mo le charge entier en mémoire sur un poste d'école.
  convert: ^3.1.2
  cryptography: ^2.7.0          # Ed25519 (vérif signature licence) — crypto seul ne fait que SHA/HMAC
  flutter_secure_storage: ^9.2.4 # coffre licence (Keychain/Keystore ; faible desktop → intégrité par signature)
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  http: ^1.6.0

  # ── Phase 2 (décommenter quand besoin) ──────────────────────────────────
  # powersync: ^1.18.0          ← offline-first sync
  # fl_chart: ^0.69.0           ← graphiques
  # reactive_forms: ^17.0.1     ← formulaires avancés
  # image_picker: ^1.1.2        ← photo élèves
  file_picker: ^8.1.7         # upload logos groupes
  pdf: ^3.12.0                # génération PDF
  printing: ^5.14.3           # impression + téléchargement PDF
  pdfrx: ^2.4.4
  # ⚠️ Plancher à 6.8.1 : c'est la première version dont le greffon Windows
  # (audioplayers_windows 4.4.1) compile avec Visual Studio 18 (2026). En deçà,
  # il inclut <experimental/coroutine>, que MSVC 14.51 transforme en erreur
  # dure — la compilation Windows échoue, et elle seule. Voir aussi la
  # politique CMP0091 exigée dans windows/CMakeLists.txt.
  audioplayers: ^6.8.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  visibility_detector: ^0.4.0+2
  # path_provider: ^2.1.5       ← chemins fichiers
  # path: ^1.9.1
  # firebase_core: ^3.13.0      ← notifications push
  # firebase_messaging: ^15.2.5
  # flutter_local_notifications: ^18.0.1
  # pdf: ^3.11.3                ← bulletins PDF
  # printing: ^5.13.1
  # flutter_animate: ^4.5.2     ← animations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/logo.svg
    - assets/geo/
    # Polices des documents officiels — EMBARQUÉES, jamais téléchargées.
    # `PdfGoogleFonts` va les chercher sur fonts.gstatic.com : sans réseau et
    # sans cache, le moteur PDF retombe sur Helvetica, qui ne gère PAS
    # l'Unicode. Tous les accents des documents officiels sautaient alors —
    # sur un produit offline-first destiné aux écoles congolaises, c'est
    # inacceptable. Voir OfficialPdfKit.loadFonts().
    - assets/fonts/
