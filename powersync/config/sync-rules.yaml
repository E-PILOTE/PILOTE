# E-PILOTE CONGO — Règles de synchronisation PowerSync
# https://docs.powersync.com/usage/sync-rules
# Déployer via le dashboard PowerSync Cloud après chaque modification.
#
# ⚠️ MOTIF « bucket_definitions » (paramètres + data) — PAS de JOIN.
# PowerSync NE SUPPORTE PAS les JOIN dans les data queries : chaque data query
# est mono-table et filtre sur un paramètre de bucket résolu une seule fois
# depuis profiles (group_id / school_id / access_profile_id / user_id).
# L'ancien format « streams » (edition 3) utilisait des JOIN → AUCUNE donnée
# paramétrée ne descendait. Corrigé 2026-06-10.
#
# Périmètre (data-minimization, plateforme gouvernementale) :
#   • Référentiel plateforme (catégories/modules/plan_modules) → global.
#   • Profil + messages + notifications + sa propre fiche staff → par utilisateur.
#   • Profil d'accès + permissions → par access_profile_id (le sien).
#   • Données de niveau groupe (écoles, calendrier, annonces, événements…) → group_id.
#   • Données opérationnelles école (classes, élèves, notes, présences…) → school_id.
#   • Données SENSIBLES → school_id ET restreintes par RÔLE :
#       - Finance (payroll, expenses, budget_lines, staff_members[salaire/IBAN])
#         → comptable, directeur, proviseur.
#       - Discipline → cpe, surveillant, directeur, proviseur.
#       - Médical (infirmary_visits) → infirmier, directeur, proviseur.

bucket_definitions:

  # ════════════════════════════════════════════════════════════════════════
  # RÉFÉRENTIEL PLATEFORME (global — synchronisé à tous)
  # ════════════════════════════════════════════════════════════════════════
  global_catalog:
    data:
      - SELECT * FROM module_categories
      - SELECT * FROM modules WHERE is_active = true
      - SELECT * FROM plan_modules
      # Référentiel des cycles (libellés/ordre) — petit, partagé à tous.
      - SELECT * FROM education_cycles WHERE is_active = true
      # Référentiel GLOBAL niveaux + filières (group_id NULL = standard Congo).
      # Les variantes propres au groupe sont synchronisées via by_group.
      - SELECT * FROM education_levels WHERE is_active = true AND group_id IS NULL
      - SELECT * FROM education_programs WHERE is_active = true AND group_id IS NULL
      # Messages de service affichés sur la vitrine des postes (migration 0034).
      - SELECT id, body, is_active, starts_at, ends_at
          FROM platform_service_messages WHERE is_active = true

  # ════════════════════════════════════════════════════════════════════════
  # PROPRE À L'UTILISATEUR (profil, messages, notifications, sa fiche staff)
  # ════════════════════════════════════════════════════════════════════════
  by_user:
    parameters: SELECT id AS uid FROM profiles WHERE id = request.user_id()
    data:
      # profiles : géré UNIQUEMENT par le bucket `directory` ci-dessous (sinon
      # conflit de projection entre deux buckets → colonnes NULL en local).
      - SELECT * FROM messages WHERE sender_id = bucket.uid OR recipient_id = bucket.uid
      - SELECT * FROM notifications WHERE recipient_id = bucket.uid
      - SELECT * FROM support_tickets WHERE submitted_by = bucket.uid
      - SELECT * FROM support_ticket_messages WHERE ticket_owner_id = bucket.uid
      - SELECT * FROM saved_announcements WHERE user_id = bucket.uid

  # ── Chat de groupe : conversations dont je suis membre (sans JOIN) ──────────
  by_conversation:
    parameters: >-
      SELECT conversation_id AS cid FROM conversation_members
      WHERE user_id = request.user_id()
    data:
      - SELECT * FROM conversations WHERE id = bucket.cid
      - SELECT * FROM conversation_members WHERE conversation_id = bucket.cid
      - SELECT * FROM messages WHERE conversation_id = bucket.cid

  # ── Annuaire de l'établissement = SEULE source de `profiles` (soi + collègues)
  # PowerSync interdit `!=` avec un bucket param et `request.*` en data query :
  # impossible d'exclure soi-même. On met donc TOUTES les colonnes utiles (le
  # profil complet du membre lui est ainsi correct en local) SAUF `fcm_token`
  # (jeton push, seule donnée vraiment sensible). Un seul bucket = aucun conflit.
  directory:
    parameters: >-
      SELECT school_id AS sid FROM profiles
      WHERE id = request.user_id() AND school_id IS NOT NULL
    data:
      - SELECT id, group_id, school_id, role, access_profile_id,
          first_name, last_name, phone, avatar_url, employee_number,
          date_of_birth, is_active, last_login, created_at, updated_at,
          pin_reset_requested_at
        FROM profiles
        WHERE school_id = bucket.sid AND is_active = true

  # ── Profils d'accès + permissions de TOUT le groupe (verrous 3 & 4) ────────
  # Postes PARTAGÉS : un même appareil sert plusieurs agents (Proviseur,
  # Comptable, Secrétaire…). Le gating UI de CHAQUE agent doit fonctionner
  # hors-ligne → on synchronise tous les access_profiles + profile_permissions
  # du groupe (volume minuscule : ~profils × modules). L'app applique ensuite
  # les permissions de l'« agent actif » localement (cf. activeAgentIdProvider).
  # (Géré dans by_group ci-dessous pour éviter un bucket supplémentaire.)

  # ════════════════════════════════════════════════════════════════════════
  # NIVEAU GROUPE (écoles, calendrier, annonces, événements, annuaire élargi)
  # ════════════════════════════════════════════════════════════════════════
  by_group:
    parameters: >-
      SELECT group_id AS gid FROM profiles
      WHERE id = request.user_id() AND group_id IS NOT NULL
    data:
      - SELECT * FROM school_groups WHERE id = bucket.gid
      - SELECT * FROM schools WHERE group_id = bucket.gid AND is_active = true
      # Profils d'accès + permissions de tout le groupe (bascule d'agent offline)
      - SELECT * FROM access_profiles WHERE group_id = bucket.gid
      - SELECT * FROM profile_permissions WHERE group_id = bucket.gid
      - SELECT * FROM academic_years WHERE group_id = bucket.gid
      - SELECT * FROM trimesters WHERE group_id = bucket.gid
      - SELECT * FROM sequences WHERE group_id = bucket.gid
      # Programmes officiels du GROUPE (school_id NULL = curriculum partagé)
      - SELECT * FROM school_programs WHERE group_id = bucket.gid AND school_id IS NULL
      # Catalogue de niveaux du groupe (rattachés à un cycle) → structure scolaire
      - SELECT * FROM school_levels WHERE group_id = bucket.gid AND is_active = true
      # Variantes niveaux/filières PROPRES au groupe (référentiel global = global_catalog)
      - SELECT * FROM education_levels WHERE group_id = bucket.gid AND is_active = true
      - SELECT * FROM education_programs WHERE group_id = bucket.gid AND is_active = true
      - SELECT * FROM announcements WHERE group_id = bucket.gid AND is_published = true
      - SELECT * FROM events WHERE group_id = bucket.gid AND is_published = true
      - SELECT * FROM announcement_reactions WHERE group_id = bucket.gid
      - SELECT * FROM announcement_comments WHERE group_id = bucket.gid
      # NB : pas de filtre temporel ici — PowerSync n'évalue pas `now()` et ne
      # réévalue pas les règles dans le temps. L'expiration 24h est filtrée
      # côté client (scopedStoriesProvider). Un purge serveur des stories
      # expirées les retirera alors des appareils.
      - SELECT * FROM stories WHERE group_id = bucket.gid
      - SELECT * FROM story_views WHERE group_id = bucket.gid
      - SELECT * FROM student_transfers WHERE group_id = bucket.gid
      - SELECT * FROM student_tutors WHERE group_id = bucket.gid
      - SELECT * FROM bulletin_subject_lines WHERE group_id = bucket.gid
      # payment_configs : api_key / api_secret JAMAIS exposés (liste explicite)
      - SELECT id, group_id, provider, display_name, merchant_id, webhook_url,
          is_active, is_test_mode, configured_by, configured_at, notes,
          created_at, updated_at
        FROM payment_configs WHERE group_id = bucket.gid AND is_active = true

  # ════════════════════════════════════════════════════════════════════════
  # NIVEAU ÉCOLE (données opérationnelles non sensibles)
  # ════════════════════════════════════════════════════════════════════════
  by_school:
    parameters: >-
      SELECT school_id AS sid FROM profiles
      WHERE id = request.user_id() AND school_id IS NOT NULL
    data:
      # Structure & acteurs
      - SELECT * FROM classes WHERE school_id = bucket.sid AND is_active = true
      # Cycles RÉELS configurés pour l'école (affichage dynamique des niveaux)
      - SELECT * FROM school_cycles WHERE school_id = bucket.sid
      - SELECT * FROM class_enrollments WHERE school_id = bucket.sid
      - SELECT * FROM students WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM teacher_subjects WHERE school_id = bucket.sid
      - SELECT * FROM subjects WHERE school_id = bucket.sid AND is_active = true
      # Programme par classe : coefficient effectif (override) + volume horaire
      - SELECT * FROM class_subjects WHERE school_id = bucket.sid
      # Programmes pédagogiques (syllabus matière × niveau, officiels + perso)
      - SELECT * FROM school_programs WHERE school_id = bucket.sid
      # Emploi du temps — ressources & trame (registre salles, trame horaire,
      # disponibilités enseignant, versions/publication d'EDT)
      - SELECT * FROM rooms WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM school_periods WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM teacher_availability WHERE school_id = bucket.sid
      - SELECT * FROM timetable_versions WHERE school_id = bucket.sid
      # Calendrier scolaire : jours non ouvrés (vacances + fériés) → projection
      # de la trame sur le calendrier réel (vues mois/trimestre/annuel)
      - SELECT * FROM school_holidays WHERE school_id = bucket.sid
      # Exceptions ponctuelles à la trame (séance annulée/déplacée/exceptionnelle)
      - SELECT * FROM timetable_exceptions WHERE school_id = bucket.sid
      # Journal d'audit EDT UNIQUEMENT (pas les autres modules : data-minimization)
      # → historique des modifications de l'emploi du temps, offline. Une requête
      # par table (PowerSync n'accepte pas `IN (liste)` en data-query, seulement
      # `=` ou `IN (SELECT …)`).
      - SELECT id, group_id, school_id, user_id, user_role, action, table_name,
          record_id, old_values, new_values, created_at
        FROM audit_logs WHERE school_id = bucket.sid AND table_name = 'timetable_slots'
      - SELECT id, group_id, school_id, user_id, user_role, action, table_name,
          record_id, old_values, new_values, created_at
        FROM audit_logs WHERE school_id = bucket.sid AND table_name = 'timetable_exceptions'
      - SELECT id, group_id, school_id, user_id, user_role, action, table_name,
          record_id, old_values, new_values, created_at
        FROM audit_logs WHERE school_id = bucket.sid AND table_name = 'timetable_versions'
      # Quotidien
      - SELECT * FROM timetable_slots WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM lesson_entries WHERE school_id = bucket.sid
      - SELECT * FROM attendance_records WHERE school_id = bucket.sid
      - SELECT * FROM attendance_entries WHERE school_id = bucket.sid
      # Évaluation
      - SELECT * FROM evaluations WHERE school_id = bucket.sid
      - SELECT * FROM grades WHERE school_id = bucket.sid
      - SELECT * FROM competence_grades WHERE school_id = bucket.sid
      - SELECT * FROM bulletins WHERE school_id = bucket.sid
      # Finance non sensible (frais + paiements élèves)
      - SELECT * FROM fee_structures WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM student_payments WHERE school_id = bucket.sid
      # Vie scolaire non sensible
      - SELECT * FROM canteen_records WHERE school_id = bucket.sid
      - SELECT * FROM library_items WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM library_loans WHERE school_id = bucket.sid
      # Documents & mobilité
      - SELECT * FROM student_documents WHERE school_id = bucket.sid
      - SELECT * FROM student_orientations WHERE school_id = bucket.sid
      - SELECT * FROM leave_requests WHERE school_id = bucket.sid

  # ════════════════════════════════════════════════════════════════════════
  # SENSIBLE — buckets PAR CAPACITÉ (pilotés par le PROFIL D'ACCÈS, pas le rôle).
  # Les drapeaux sync_finance / sync_discipline / sync_medical sont dénormalisés
  # sur `profiles` par trigger (migration 0005_profile_sensitive_scopes.sql) à
  # partir des can_read du profil d'accès du membre :
  #   • sync_finance    ← modules depenses|budget|personnel|presences-personnel|
  #                        conges|paie  → staff_members, payroll, expenses, budget
  #   • sync_discipline ← module discipline                 → discipline_incidents
  #   • sync_medical    ← module infirmerie                 → infirmary_visits
  # Ainsi n'importe quel rôle obtient RÉELLEMENT la donnée si son profil l'accorde
  # (enseignant + profil Comptable = données financières offline). 3 buckets au
  # lieu de 6 buckets-par-rôle. frais-scolarite/paiements-eleves restent non
  # sensibles (bucket by_school).
  # ⚠️ Requiert que la migration 0005 soit appliquée AVANT le déploiement.
  # ════════════════════════════════════════════════════════════════════════

  # ── Finance / RH : staff_members, payroll, expenses, budget_lines ─────────
  sensitive_finance:
    parameters: >-
      SELECT school_id AS sid FROM profiles
      WHERE id = request.user_id() AND school_id IS NOT NULL AND sync_finance = true
    data:
      - SELECT * FROM staff_members WHERE school_id = bucket.sid AND is_active = true
      - SELECT * FROM payroll WHERE school_id = bucket.sid
      - SELECT * FROM expenses WHERE school_id = bucket.sid
      - SELECT * FROM budget_lines WHERE school_id = bucket.sid
      # Dossier RH de l'agent : pointage, parcours, diplômes (migration 0023)
      - SELECT * FROM staff_attendance WHERE school_id = bucket.sid
      - SELECT * FROM staff_career WHERE school_id = bucket.sid
      - SELECT * FROM staff_diplomas WHERE school_id = bucket.sid

  # ── Discipline : discipline_incidents ─────────────────────────────────────
  sensitive_discipline:
    parameters: >-
      SELECT school_id AS sid FROM profiles
      WHERE id = request.user_id() AND school_id IS NOT NULL AND sync_discipline = true
    data:
      - SELECT * FROM discipline_incidents WHERE school_id = bucket.sid

  # ── Médical : infirmary_visits (mineurs) ──────────────────────────────────
  sensitive_medical:
    parameters: >-
      SELECT school_id AS sid FROM profiles
      WHERE id = request.user_id() AND school_id IS NOT NULL AND sync_medical = true
    data:
      - SELECT * FROM infirmary_visits WHERE school_id = bucket.sid
