# ════════════════════════════════════════════════════════════════════════════
#  Chaîne de livraison Windows — la plateforme de DÉPLOIEMENT du produit.
#
#  Le développement se fait sous Linux ; les établissements, eux, tournent sous
#  Windows 10/11. On ne peut pas compiler Windows depuis un poste Linux : ce
#  fichier est donc la SEULE façon de produire le binaire qui sera déployé, et
#  la seule preuve continue que l'application compile pour sa cible.
#
#  Deux travaux DÉLIBÉRÉMENT indépendants :
#    • `verification` (Linux)  — analyse et tests, dont les golden tests, qui
#      sont calibrés sur le rendu de police Linux et échoueraient sous Windows
#      pour des écarts d'antialiasing sans le moindre rapport avec un défaut.
#    • `windows`               — la compilation et l'artefact.
#  Le second ne dépend pas du premier : un test rouge ne doit pas nous priver de
#  l'information « est-ce que ça compile ». Ce couplage sera resserré une fois
#  la chaîne stabilisée, avant le déploiement.
# ════════════════════════════════════════════════════════════════════════════

name: Windows

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée sur la même branche annule la construction précédente :
# la compilation Windows est longue, on ne fait pas la queue pour rien.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Épinglée sur la version du poste de développement. Une montée de version de
  # Flutter est une décision, jamais un effet de bord d'un runner mis à jour.
  FLUTTER_VERSION: '3.44.0'

jobs:
  verification:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        working-directory: epilote
        run: flutter pub get

      - name: Analyse statique
        working-directory: epilote
        run: flutter analyze

      - name: Tests
        working-directory: epilote
        run: flutter test

  windows:
    name: Construction Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        working-directory: epilote
        run: flutter pub get

      # Les mêmes tests, mais exécutés SUR Windows. Ils n'y valident pas la
      # logique — la CI Linux s'en charge — mais tout ce qui dépend en silence
      # de la plateforme : séparateurs de chemin, encodage des accents, format
      # des nombres et des dates sous une locale française.
      # Les golden en sont écartés : leurs images de référence ont été rendues
      # sous Linux et n'ont pas d'équivalent ici.
      - name: Tests sur Windows
        working-directory: epilote
        run: flutter test --exclude-tags golden

      - name: Compilation
        working-directory: epilote
        run: flutter build windows --release

      # Vérification que l'identité de l'application est bien passée dans le
      # binaire : c'est cette fiche que l'agent d'un établissement consulte
      # avant d'installer, et c'est elle que le certificat de signature devra
      # confirmer. Un « epilote / cg.epilote » ici signifierait que
      # windows/runner/Runner.rc n'a pas été pris en compte.
      - name: Identité du binaire
        working-directory: epilote
        shell: pwsh
        run: |
          $exe = 'build\windows\x64\runner\Release\E-PILOTE.exe'
          if (-not (Test-Path $exe)) { throw "Binaire introuvable : $exe" }
          (Get-Item $exe).VersionInfo | Format-List `
            CompanyName, ProductName, FileDescription, FileVersion, ProductVersion
          '{0:N1} Mo' -f ((Get-Item $exe).Length / 1MB)

      # Le démarrage réel. Compiler ne prouve rien sur le chargement des DLL :
      # une extension native absente ou incompatible — `powersync_x64.dll` pour
      # la base hors ligne, `libmpv-2.dll` pour la vidéo — ne se manifeste qu'à
      # l'exécution, par une fermeture immédiate. C'est exactement ce que cette
      # étape attrape, et c'est ce qu'on aurait découvert sur le poste d'un
      # établissement à défaut de le faire ici.
      - name: Démarrage du binaire
        working-directory: epilote
        shell: pwsh
        run: |
          $exe = 'build\windows\x64\runner\Release\E-PILOTE.exe'
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            throw "L'application s'est arrêtée seule au démarrage " +
                  "(code $($p.ExitCode)). Une bibliothèque native manque " +
                  "ou refuse de se charger."
          }
          Write-Host "✓ Toujours en vie après 30 s (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force

      # L'installateur. Le dossier « Release » brut n'est pas distribuable :
      # 108 Mo en vingt-six DLL, dont personne dans un établissement ne saura
      # quoi faire. Inno Setup en fait un unique .exe à double-cliquer.
      - name: Installateur
        shell: pwsh
        run: |
          $pubspec = Get-Content epilote\pubspec.yaml | Select-String '^version:'
          # « 3.1.7+18 » -> « 3.1.7 » : Inno Setup n'accepte pas le « + ».
          $version = ($pubspec -split ':')[1].Trim().Split('+')[0]
          Write-Host "Version : $version"

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Inno Setup absent du runner — installation'
            choco install innosetup --no-progress -y
          }

          & $iscc "/DAppVersion=$version" packaging\windows\epilote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }

          Get-ChildItem dist\*.exe | ForEach-Object {
            '{0} — {1:N1} Mo' -f $_.Name, ($_.Length / 1MB)
          }

      - name: Artefact — installateur
        uses: actions/upload-artifact@v4
        with:
          name: E-PILOTE-installateur-${{ github.sha }}
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: E-PILOTE-windows-x64-${{ github.sha }}
          # Le dossier ENTIER : l'exécutable seul ne démarre pas. Il lui faut
          # les DLL du moteur Flutter, celles des greffons natifs (PowerSync,
          # media_kit) et le dossier `data/` des ressources Dart.
          path: epilote/build/windows/x64/runner/Release/
          retention-days: 30
          if-no-files-found: error
